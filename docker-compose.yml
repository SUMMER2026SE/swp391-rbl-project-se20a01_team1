services:
  postgres:
    image: postgres:16-alpine
    container_name: amp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart-rental_platform
    volumes:
      - amp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart-rental_platform"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  amp_pg_data:
